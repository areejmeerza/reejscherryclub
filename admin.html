<!DOCTYPE html>
<html lang="en">
<!-- Cherry Club admin -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cherry Club — Admin 🍒</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f5f1eb;
      color: #111;
      font-family: Arial, sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 40px;
      box-shadow: 0 15px 50px rgba(0,0,0,.08);
    }

    .login-logo {
      text-align: center;
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 42px;
      margin-bottom: 8px;
    }

    .login-subtitle {
      text-align: center;
      color: #888;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 35px;
    }

    .login-box label,
    .form-box label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #777;
      margin-bottom: 7px;
    }

    .login-box input,
    .form-box input,
    .form-box textarea,
    .form-box select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      background: #fafafa;
      margin-bottom: 18px;
      outline: none;
    }

    .login-box input:focus,
    .form-box input:focus,
    .form-box textarea:focus,
    .form-box select:focus {
      border-color: #111;
    }

    .black-button {
      width: 100%;
      border: 0;
      background: #111;
      color: white;
      padding: 15px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 10px;
    }

    .black-button:hover {
      background: #a20f20;
    }

    .error {
      color: #a20f20;
      font-size: 12px;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    /* ADMIN */

    #admin-screen {
      min-height: 100vh;
    }

    header {
      height: 72px;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5vw;
    }

    .admin-logo {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 25px;
    }

    .admin-logo span {
      color: #d83b4c;
    }

    .logout-button {
      border: 1px solid #555;
      background: transparent;
      color: white;
      padding: 9px 14px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .logout-button:hover {
      background: white;
      color: #111;
    }

    main {
      width: min(1400px, 92vw);
      margin: 40px auto 80px;
    }

    .welcome {
      margin-bottom: 30px;
    }

    .welcome small {
      color: #888;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .welcome h1 {
      font-family: Georgia, serif;
      font-size: clamp(40px, 7vw, 70px);
      font-weight: normal;
      margin-top: 7px;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 35px;
    }

    .stat {
      background: white;
      padding: 25px;
      border: 1px solid #e5e0da;
    }

    .stat-label {
      color: #888;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .stat-number {
      font-family: Georgia, serif;
      font-size: 38px;
      margin-top: 10px;
    }

    /* TABS */

    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 25px;
      border-bottom: 1px solid #ddd;
    }

    .tab {
      border: 0;
      background: transparent;
      padding: 13px 20px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #777;
    }

    .tab.active {
      background: #111;
      color: white;
    }

    /* SECTION */

    .section-card {
      background: white;
      border: 1px solid #e5e0da;
      margin-bottom: 25px;
    }

    .section-heading {
      padding: 22px 25px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .section-heading h2 {
      font-family: Georgia, serif;
      font-size: 27px;
      font-weight: normal;
    }

    .small-button {
      border: 0;
      background: #111;
      color: white;
      padding: 11px 15px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .small-button:hover {
      background: #a20f20;
    }

    /* ORDERS */

    .orders-container {
      padding: 15px;
    }

    .order {
      border: 1px solid #e5e0da;
      margin-bottom: 12px;
      background: #faf9f7;
    }

    .order:last-child {
      margin-bottom: 0;
    }

    .order-top {
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      flex-wrap: wrap;
    }

    .order-number {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 7px;
    }

    .order-name {
      font-family: Georgia, serif;
      font-size: 24px;
    }

    .order-date {
      color: #888;
      font-size: 10px;
      margin-top: 5px;
    }

    .status-select {
      padding: 9px 12px;
      border: 1px solid #ccc;
      background: white;
      font-size: 10px;
    }

    .order-details {
      border-top: 1px solid #e5e0da;
      padding: 18px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .detail-label {
      font-size: 8px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }

    .detail-value {
      font-size: 12px;
      line-height: 1.6;
      word-break: break-word;
    }

    .order-items {
      border-top: 1px solid #e5e0da;
      padding: 18px;
    }

    .order-items-title {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #888;
      margin-bottom: 12px;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 9px 0;
      border-bottom: 1px solid #eee;
      font-size: 12px;
    }

    .order-item:last-child {
      border-bottom: 0;
    }

    .order-total {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #111;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }

    /* PRODUCTS */

    .products-container {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .product-card {
      border: 1px solid #e5e0da;
      background: #faf9f7;
      overflow: hidden;
    }

    .product-image {
      width: 100%;
      aspect-ratio: 4/5;
      object-fit: cover;
      background: #ddd6cf;
      display: block;
    }

    .product-placeholder {
      width: 100%;
      aspect-ratio: 4/5;
      background: #ddd6cf;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
    }

    .product-card-info {
      padding: 15px;
    }

    .product-card-name {
      font-family: Georgia, serif;
      font-size: 20px;
    }

    .product-card-meta {
      color: #888;
      font-size: 10px;
      margin-top: 6px;
    }

    .product-card-price {
      margin-top: 12px;
      font-weight: bold;
      font-size: 13px;
    }

    .product-card-status {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 8px;
      background: #111;
      color: white;
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .product-actions {
      display: flex;
      gap: 7px;
      margin-top: 15px;
    }

    .product-actions button {
      flex: 1;
      padding: 9px;
      border: 1px solid #ccc;
      background: white;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .product-actions button:hover {
      background: #111;
      color: white;
    }

    /* FORM */

    .form-box {
      padding: 25px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0 20px;
    }

    .form-full {
      grid-column: 1 / -1;
    }

    .form-box textarea {
      min-height: 110px;
      resize: vertical;
    }

    .form-buttons {
      display: flex;
      gap: 10px;
    }

    .form-buttons button {
      padding: 13px 20px;
      border: 0;
      background: #111;
      color: white;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-buttons .cancel {
      background: #ddd;
      color: #111;
    }

    /* EMPTY */

    .empty {
      padding: 50px 20px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }

    .loading {
      padding: 40px;
      text-align: center;
      color: #888;
    }

    /* MOBILE */

    @media(max-width: 700px) {

      header {
        padding: 0 20px;
      }

      main {
        width: calc(100% - 30px);
        margin-top: 25px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .stat {
        padding: 18px;
      }

      .stat-number {
        font-size: 30px;
      }

      .order-details {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .products-container {
        grid-template-columns: repeat(2, 1fr);
        padding: 10px;
      }

      .product-card-name {
        font-size: 16px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-full {
        grid-column: auto;
      }

      .tabs {
        overflow-x: auto;
      }

      .tab {
        white-space: nowrap;
      }

      .section-heading {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="login-screen">

  <div class="login-box">

    <div class="login-logo">
      Cherry Club 🍒
    </div>

    <div class="login-subtitle">
      Private admin portal
    </div>

    <div id="login-error" class="error hidden"></div>

    <form id="login-form">

      <label>Email</label>

      <input
        id="login-email"
        type="email"
        autocomplete="email"
        required
      >

      <label>Password</label>

      <input
        id="login-password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button
        class="black-button"
        type="submit"
        id="login-button"
      >
        Enter Cherry Club →
      </button>

    </form>

  </div>

</div>


<!-- =========================
     ADMIN
========================= -->

<div id="admin-screen" class="hidden">

  <header>

    <div class="admin-logo">
      Cherry <span>🍒</span> Club
    </div>

    <button
      class="logout-button"
      onclick="logout()"
    >
      Log out
    </button>

  </header>


  <main>

    <div class="welcome">

      <small>
        Your private control room
      </small>

      <h1>
        Welcome back 🍒
      </h1>

    </div>


    <!-- STATS -->

    <div class="stats">

      <div class="stat">

        <div class="stat-label">
          Total orders
        </div>

        <div
          class="stat-number"
          id="stat-orders"
        >
          0
        </div>

      </div>

      <div class="stat">

        <div class="stat-label">
          Pending
        </div>

        <div
          class="stat-number"
          id="stat-pending"
        >
          0
        </div>

      </div>

      <div class="stat">

        <div class="stat-label">
          Products
        </div>

        <div
          class="stat-number"
          id="stat-products"
        >
          0
        </div>

      </div>

      <div class="stat">

        <div class="stat-label">
          Available
        </div>

        <div
          class="stat-number"
          id="stat-available"
        >
          0
        </div>

      </div>

    </div>


    <!-- TABS -->

    <div class="tabs">

      <button
        class="tab active"
        id="orders-tab"
        onclick="showTab('orders')"
      >
        Orders
      </button>

      <button
        class="tab"
        id="products-tab"
        onclick="showTab('products')"
      >
        Products
      </button>

    </div>


    <!-- ORDERS -->

    <section
      id="orders-section"
      class="section-card"
    >

      <div class="section-heading">

        <h2>
          Orders
        </h2>

        <button
          class="small-button"
          onclick="loadEverything()"
        >
          Refresh
        </button>

      </div>

      <div
        id="orders-container"
        class="orders-container"
      >
        <div class="loading">
          Loading orders 🍒
        </div>
      </div>

    </section>


    <!-- PRODUCTS -->

    <section
      id="products-section"
      class="section-card hidden"
    >

      <div class="section-heading">

        <h2>
          Products
        </h2>

        <button
          class="small-button"
          onclick="openProductForm()"
        >
          + Add product
        </button>

      </div>


      <!-- PRODUCT FORM -->

      <div
        id="product-form-area"
        class="form-box hidden"
      >

        <h3
          id="product-form-title"
          style="
            font-family:Georgia,serif;
            font-size:28px;
            font-weight:normal;
            margin-bottom:25px;
          "
        >
          Add product
        </h3>

        <form id="product-form">

          <input
            type="hidden"
            id="editing-product-id"
          >

          <div class="form-grid">

            <div>

              <label>
                Product name
              </label>

              <input
                id="product-name"
                required
              >

            </div>


            <div>

              <label>
                Category
              </label>

              <select
                id="product-category"
                required
              >

                <option value="">
                  Choose category
                </option>

                <option>Dresses</option>
                <option>Tops</option>
                <option>Jeans</option>
                <option>Bottoms</option>
                <option>Shoes</option>
                <option>Accessories</option>
                <option>Women</option>
                <option>Men</option>
                <option>Unisex</option>

              </select>

            </div>


            <div>

              <label>
                Price (PKR)
              </label>

              <input
                id="product-price"
                type="number"
                min="0"
                required
              >

            </div>


            <div>

              <label>
                Size
              </label>

              <input
                id="product-size"
                placeholder="e.g. S / M / 28-32"
              >

            </div>


            <div>

              <label>
                Status
              </label>

              <select id="product-status">

                <option value="available">
                  Available
                </option>

                <option value="sold">
                  Sold
                </option>

                <option value="hidden">
                  Hidden
                </option>

              </select>

            </div>


            <div>

              <label>
                Image URL
              </label>

              <input
                id="product-image"
                type="url"
                placeholder="Paste image link"
              >

            </div>


            <div class="form-full">

              <label>
                Description
              </label>

              <textarea
                id="product-description"
                placeholder="Tell customers about this piece..."
              ></textarea>

            </div>

          </div>


          <div class="form-buttons">

            <button
              type="submit"
              id="save-product-button"
            >
              Save product
            </button>

            <button
              type="button"
              class="cancel"
              onclick="closeProductForm()"
            >
              Cancel
            </button>

          </div>

        </form>

      </div>


      <div
        id="products-container"
        class="products-container"
      >
        <div
          class="loading"
          style="grid-column:1/-1;"
        >
          Loading products 🍒
        </div>
      </div>

    </section>

  </main>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://jqpkvttexoekaoylwtkg.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_QzAhQAxVVhrOdR0zhPbHBg_5c0LDxKF";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let orders = [];
let orderItems = [];
let adminProducts = [];


/* =========================================================
   LOGIN
========================================================= */

document
  .getElementById("login-form")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const email =
        document
          .getElementById("login-email")
          .value
          .trim();

      const password =
        document
          .getElementById("login-password")
          .value;

      const button =
        document.getElementById(
          "login-button"
        );

      const errorBox =
        document.getElementById(
          "login-error"
        );

      errorBox.classList.add(
        "hidden"
      );

      button.disabled = true;

      button.textContent =
        "Logging in...";

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .signInWithPassword({
            email,
            password
          });

      if (error) {

        console.error(
          "Login error:",
          error
        );

        errorBox.textContent =
          "Login didn't work. Check your email and password.";

        errorBox.classList.remove(
          "hidden"
        );

        button.disabled = false;

        button.textContent =
          "Enter Cherry Club →";

        return;
      }

      showAdmin();

    }
  );


/* =========================================================
   CHECK EXISTING LOGIN
========================================================= */

async function checkLogin() {

  const {
    data
  } =
    await supabaseClient
      .auth
      .getSession();

  if (
    data &&
    data.session
  ) {

    showAdmin();

  }

}


/* =========================================================
   SHOW ADMIN
========================================================= */

function showAdmin() {

  document
    .getElementById(
      "login-screen"
    )
    .classList.add(
      "hidden"
    );

  document
    .getElementById(
      "admin-screen"
    )
    .classList.remove(
      "hidden"
    );

  loadEverything();

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

  await supabaseClient
    .auth
    .signOut();

  location.reload();

}


/* =========================================================
   LOAD EVERYTHING
========================================================= */

async function loadEverything() {

  await Promise.all([
    loadOrders(),
    loadOrderItems(),
    loadAdminProducts()
  ]);

  updateStats();

  renderOrders();

  renderAdminProducts();

}


/* =========================================================
   ORDERS
========================================================= */

async function loadOrders() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("orders")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );

  if (error) {

    console.error(
      "Orders error:",
      error
    );

    document
      .getElementById(
        "orders-container"
      )
      .innerHTML = `
        <div class="empty">
          We couldn't load the orders.
          Check your Supabase permissions.
        </div>
      `;

    return;
  }

  orders =
    Array.isArray(data)
      ? data
      : [];

}


/* =========================================================
   ORDER ITEMS
========================================================= */

async function loadOrderItems() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("order_items")
      .select("*");

  if (error) {

    console.error(
      "Order items error:",
      error
    );

    orderItems = [];

    return;
  }

  orderItems =
    Array.isArray(data)
      ? data
      : [];

}


/* =========================================================
   PRODUCTS
========================================================= */

async function loadAdminProducts() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select(
        "id,name,category,price,size,status,image_url,description,created_at"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );

  if (error) {

    console.error(
      "Products error:",
      error
    );

    adminProducts = [];

    return;
  }

  adminProducts =
    Array.isArray(data)
      ? data
      : [];

}


/* =========================================================
   STATS
========================================================= */

function updateStats() {

  document
    .getElementById(
      "stat-orders"
    )
    .textContent =
    orders.length;

  document
    .getElementById(
      "stat-pending"
    )
    .textContent =
    orders.filter(
      order =>
        order.status ===
        "pending"
    ).length;

  document
    .getElementById(
      "stat-products"
    )
    .textContent =
    adminProducts.length;

  document
    .getElementById(
      "stat-available"
    )
    .textContent =
    adminProducts.filter(
      product =>
        product.status ===
        "available"
    ).length;

}


/* =========================================================
   FORMAT
========================================================= */

function formatPrice(value) {

  return Number(
    value || 0
  ).toLocaleString(
    "en-PK"
  );

}


function escapeHTML(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function formatDate(value) {

  if (!value) {
    return "Unknown date";
  }

  return new Date(
    value
  ).toLocaleString(
    "en-PK",
    {
      dateStyle: "medium",
      timeStyle: "short"
    }
  );

}

          );

          <article class="order">

            <div class="order-top">

                <div class="order-number">
                  Order #${escapeHTML(
                    order.id

                </div>

                <div class="order-name">

                    order.customer_name

                </div>

                </div>

              </div>

                  order.id

                  order.status

            </div>

                </div>

              </div>


              <div>

                <div class="detail-label">

                <div class="detail-value">
                  ${escapeHTML(
                    order.city

                </div>

              </div>


              <div>

                <div class="detail-label">
                  Address
                </div>

                <div class="detail-value">
                  ${escapeHTML(
                    order.address
                  )}
                </div>

              </div>


              <div>

                </div>

                </div>

                </div>

                <div class="detail-value">

                    order.transaction_id
                  )}

              </div>

                </div>

                <div class="detail-value">

                        )}`
                        :

                      ${formatPrice(

/* =========================================================
   STATUS OPTIONS
========================================================= */

function statusOptions(current) {

  const statuses = [
    "pending",
    "confirmed",
    "shipped",
    "delivered",
    "cancelled"
  ];

  return statuses
    .map(status => `

      <option
        value="${status}"
        ${
          String(current) ===
          status
          ? "selected"
          : ""
        }
      >
        ${status.charAt(0).toUpperCase() + status.slice(1)}
      </option>

    `)
    .join("");

}


/* =========================================================
   CHANGE ORDER STATUS
========================================================= */

async function changeOrderStatus(select) {

  const orderId =
    select.dataset.orderId;

  const newStatus =
    select.value;

  select.disabled = true;

  const {
    error
  } =
    await supabaseClient
      .from("orders")
      .update({
        status: newStatus
      })
      .eq(
        "id",
        orderId
      );

  select.disabled = false;

  if (error) {

    console.error(
      "Status update error:",
      error
    );

    alert(
      "I couldn't update that order status."
    );

    await loadOrders();

    renderOrders();

    return;
  }

  const order =
    orders.find(
      item =>
        String(item.id) ===
        String(orderId)
    );

  if (order) {
    order.status =
      newStatus;
  }

  updateStats();

}


/* =========================================================
   TABS
========================================================= */

function showTab(tab) {

  const ordersSection =
    document.getElementById(
      "orders-section"
    );

  const productsSection =
    document.getElementById(
      "products-section"
    );

  const ordersTab =
    document.getElementById(
      "orders-tab"
    );

  const productsTab =
    document.getElementById(
      "products-tab"
    );


  if (tab === "orders") {

    ordersSection.classList.remove(
      "hidden"
    );

    productsSection.classList.add(
      "hidden"
    );

    ordersTab.classList.add(
      "active"
    );

    productsTab.classList.remove(
      "active"
    );

  } else {

    ordersSection.classList.add(
      "hidden"
    );

    productsSection.classList.remove(
      "hidden"
    );

    ordersTab.classList.remove(
      "active"
    );

    productsTab.classList.add(
      "active"
    );

  }

}


/* =========================================================
   PRODUCT FORM
========================================================= */

function openProductForm(product = null) {

  const area =
    document.getElementById(
      "product-form-area"
    );

  area.classList.remove(
    "hidden"
  );


  document
    .getElementById(
      "editing-product-id"
    )
    .value =
    product
      ? product.id
      : "";


  document
    .getElementById(
      "product-form-title"
    )
    .textContent =
    product
      ? "Edit product"
      : "Add product";


  document
    .getElementById(
      "product-name"
    )
    .value =
    product?.name || "";


  document
    .getElementById(
      "product-category"
    )
    .value =
    product?.category || "";


  document
    .getElementById(
      "product-price"
    )
    .value =
    product?.price || "";


  document
    .getElementById(
      "product-size"
    )
    .value =
    product?.size || "";


  document
    .getElementById(
      "product-status"
    )
    .value =
    product?.status || "available";


  document
    .getElementById(
      "product-image"
    )
    .value =
    product?.image_url || "";


  document
    .getElementById(
      "product-description"
    )
    .value =
    product?.description || "";


  area.scrollIntoView({
    behavior: "smooth"
  });

}


function closeProductForm() {

  document
    .getElementById(
      "product-form-area"
    )
    .classList.add(
      "hidden"
    );

  document
    .getElementById(
      "product-form"
    )
    .reset();

  document
    .getElementById(
      "editing-product-id"
    )
    .value = "";

}


/* =========================================================
   SAVE PRODUCT
========================================================= */

document
  .getElementById(
    "product-form"
  )
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const editingId =
        document
          .getElementById(
            "editing-product-id"
          )
          .value;


      const productData = {

        name:
          document
            .getElementById(
              "product-name"
            )
            .value
            .trim(),

        category:
          document
            .getElementById(
              "product-category"
            )
            .value,

        price:
          Number(
            document
              .getElementById(
                "product-price"
              )
              .value
          ),

        size:
          document
            .getElementById(
              "product-size"
            )
            .value
            .trim(),

        status:
          document
            .getElementById(
              "product-status"
            )
            .value,

        image_url:
          document
            .getElementById(
              "product-image"
            )
            .value
            .trim(),

        description:
          document
            .getElementById(
              "product-description"
            )
            .value
            .trim()

      };


      const button =
        document.getElementById(
          "save-product-button"
        );

      button.disabled = true;

      button.textContent =
        "Saving...";


      let error;


      if (editingId) {

        const result =
          await supabaseClient
            .from("products")
            .update(
              productData
            )
            .eq(
              "id",
              editingId
            );

        error =
          result.error;

      } else {

        const result =
          await supabaseClient
            .from("products")
            .insert(
              productData
            );

        error =
          result.error;

      }


      button.disabled = false;

      button.textContent =
        "Save product";


      if (error) {

        console.error(
          "Product save error:",
          error
        );

        alert(
          "I couldn't save that product.\n\n" +
          error.message
        );

        return;
      }


      closeProductForm();

      await loadAdminProducts();

      updateStats();

      renderAdminProducts();

    }
  );


/* =========================================================
   RENDER PRODUCTS
========================================================= */

  const container =

    );


  if (!adminProducts.length) {

    container.innerHTML = `
      <div
        class="empty"
        style="grid-column:1/-1;"
      >
        No products yet 🍒
      </div>

    return;
  }


  container.innerHTML =

        return `

          <article class="product-card">

                )}

                  )}`

                }

              </div>

                ${formatPrice(

                )}

                )}
              </div>

}


/* =========================================================
   EDIT PRODUCT
========================================================= */

function editProduct(id) {

  const product =
    adminProducts.find(
      item =>
        String(item.id) ===
        String(id)
    );

  if (!product) return;

  openProductForm(
    product
  );

}


/* =========================================================
   TOGGLE PRODUCT
========================================================= */

async function toggleProductStatus(id) {

  const product =
    adminProducts.find(
      item =>
        String(item.id) ===
        String(id)
    );

  if (!product) return;


  const newStatus =
    product.status ===
    "available"
      ? "hidden"
      : "available";


  const {
    error
  } =
    await supabaseClient
      .from("products")
      .update({
        status: newStatus
      })
      .eq(
        "id",
        id
      );


  if (error) {

    console.error(
      "Product status error:",
      error
    );

    alert(
      "I couldn't change that product."
    );

    return;
  }


  product.status =
    newStatus;


  updateStats();

  renderAdminProducts();

}
